<h2>Step 1: Encrypt File (Salsa20)</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Select File:</label><br>
    <input type="file" name="file" required><br><br>
    <button type="submit">Encrypt</button>
</form>

{% if encrypted %}
<hr>
<h3>Output</h3>
<a href="{{ encrypted }}" download>Download Encrypted BIN</a><br>
<a href="{{ key }}" download>Download Key</a><br><br>

<a href="{% url 'encode' %}">
    <button>Next : Encode</button>
</a>
{% endif %}
