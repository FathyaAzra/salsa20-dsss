<h2>Step 2: Encode (DSSS Steganography)</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Carrier Audio (WAV):</label><br>
    <input type="file" name="audio" required><br><br>

    <label>Secret File (Encrypted BIN):</label><br>
    <input type="file" name="secret_file" required><br><br>

    <label>Password:</label><br>
    <input type="text" name="password" placeholder="password"><br><br>

    <button type="submit">Encode</button>
</form>

{% if file %}
<hr>
<h3>Output</h3>
<a href="{{ file }}" download>Download Stego</a><br><br>

<a href="{% url 'decode' %}">
    <button>Go to Decode</button>
</a>
{% endif %}
