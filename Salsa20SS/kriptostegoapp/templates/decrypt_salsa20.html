<h2>Step 4: Decrypt File (Salsa20)</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Recovered BIN:</label><br>
    <input type="file" name="cipher" required><br><br>

    <label>Key File:</label><br>
    <input type="file" name="key" required><br><br>

    <button type="submit">Decrypt</button>
</form>

{% if recovered %}
<hr>
<h3>Recovered File</h3>
<a href="{{ recovered }}" download>Download Original File</a>
{% endif %}
